<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dica 3 - Dia do Trabalho</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #121212, #1f1f1f);
      font-family: 'Poppins', sans-serif;
      color: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 20px;
      color: #00BFFF;
      font-weight: 700;
      font-size: 2.2rem;
      text-align: center;
      text-shadow: 1px 1px 3px black;
    }

    .container {
      background: #222;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 500px;
      text-align: left;
      animation: fadeIn 1s ease;
      line-height: 1.6;
    }

    strong {
      color: #3399ff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95);}
      to { opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <h1>Dica 3 - Uma Conquista Internacional</h1>
  <div class="container">
    <p>
      A <strong>França</strong> foi o primeiro país a aprovar, em <strong>1919</strong>, uma lei que limitava oficialmente a jornada diária de trabalho para <strong>8 horas</strong>. Isso consolidou o <strong>1º de maio como data de luta internacional</strong>.
    </p>
  </div>
</body>
</html>
